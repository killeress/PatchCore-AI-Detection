<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta id="theme-color" name="theme-color" content="#eef3f7">
    <meta name="description" content="寧波廠區 CAPI AI 各產線即時狀態中控看板">
    <title>寧波廠區 CAPI AI 中控看板</title>
    <script>
        (function () {
            var savedTheme = "";
            try {
                savedTheme = localStorage.getItem("capi-dashboard-theme") || "";
            } catch (_error) {
                savedTheme = "";
            }
            var prefersDark = window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme =
                savedTheme === "dark" || savedTheme === "light"
                    ? savedTheme
                    : (prefersDark ? "dark" : "light");
        })();
    </script>
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./config.js"></script>
    <script defer src="./app.js"></script>
</head>
<body>
    <a class="skip-link" href="#line-overview">跳至線體總覽</a>

    <header class="topbar">
        <div class="brand-block">
            <h1 id="dashboard-title">寧波廠區 CAPI AI 中控看板</h1>
        </div>

        <div class="topbar-actions" aria-label="看板工具列">
            <div class="topbar-action-group">
                <a
                    id="dashboard-settings-link"
                    class="dashboard-settings-link"
                    href="/central_dashboard/settings"
                >
                    <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path>
                        <circle cx="16" cy="7" r="2"></circle>
                        <circle cx="8" cy="17" r="2"></circle>
                    </svg>
                    <span>設備設定</span>
                </a>
                <button
                    id="theme-toggle"
                    class="theme-toggle"
                    type="button"
                    aria-pressed="false"
                >
                    <span class="theme-toggle-track" aria-hidden="true"></span>
                    <span class="theme-toggle-label" data-theme-label>深色</span>
                </button>
            </div>
            <div class="clock-block" aria-label="目前時間">
                <span class="toolbar-label">目前時間</span>
                <strong id="current-time">--:--:--</strong>
                <span id="current-date">----</span>
            </div>
            <div class="refresh-block">
                <span class="toolbar-label">自動更新</span>
                <strong id="refresh-status" data-state="ready">準備更新</strong>
            </div>
        </div>
    </header>

    <main>
        <section class="dashboard-banner" aria-label="智慧製造 AI 視覺檢測示意圖">
        </section>

        <section class="summary-grid" aria-label="全廠摘要">
            <article class="summary-card">
                <span>納管線體</span>
                <strong id="summary-total-lines">0</strong>
            </article>
            <article class="summary-card summary-online">
                <span>運行正常</span>
                <strong id="summary-online">0</strong>
            </article>
            <article class="summary-card summary-warning">
                <span>服務異常</span>
                <strong id="summary-warning">0</strong>
            </article>
            <article class="summary-card summary-offline">
                <span>設備離線</span>
                <strong id="summary-offline">0</strong>
            </article>
        </section>

        <section class="overview-section" aria-labelledby="overview-title">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">QUICK OVERVIEW</p>
                    <h2 id="overview-title">線體即時總覽</h2>
                </div>
            </div>

            <div class="overview-table-wrap">
                <table class="overview-table">
                    <thead>
                        <tr>
                            <th scope="col">線體</th>
                            <th scope="col">IP 位址</th>
                            <th scope="col">狀態</th>
                            <th scope="col">AOI 連線</th>
                            <th scope="col">AOI 排片率</th>
                            <th scope="col">AI 排片率</th>
                            <th scope="col">最近生產活動</th>
                            <th scope="col">異常摘要</th>
                            <th scope="col">程式版本</th>
                            <th scope="col">快速導航</th>
                        </tr>
                    </thead>
                    <tbody id="line-overview" aria-live="polite"></tbody>
                </table>
            </div>
        </section>

        <section id="alert-panel" class="alert-panel" aria-labelledby="alert-title" hidden>
            <div>
                <p class="eyebrow">SYSTEM ALERT</p>
                <h2 id="alert-title">目前告警</h2>
            </div>
            <ul id="alert-list"></ul>
        </section>

        <section class="line-section" aria-labelledby="line-section-title">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">DETAILED CARDS</p>
                    <h2 id="line-section-title">線體詳細資訊</h2>
                </div>
            </div>

            <div id="config-error" class="config-error" role="alert" hidden></div>
            <div id="factory-sections" aria-live="polite"></div>
        </section>
    </main>

    <template id="line-card-template">
        <article class="line-card" data-state="checking">
            <header class="line-card-header">
                <div>
                    <div class="line-kicker">
                        <span data-field="pc-name">—</span>
                    </div>
                    <h3 data-field="line-name">—</h3>
                </div>
                <span class="status-pill" data-field="status">連線中</span>
            </header>

            <div class="line-links">
                <a data-link="dashboard" target="_blank" rel="noopener noreferrer">設備看板</a>
            </div>

            <div class="group-heading">
                <span>生產統計</span>
                <small>SHIFT KPI</small>
            </div>

            <div class="metric-grid">
                <div class="metric metric-total">
                    <span>當班投入</span>
                    <strong data-field="total">—</strong>
                    <small>包含 OK / NG / ERR</small>
                </div>
                <div class="metric metric-ok">
                    <span>OK</span>
                    <strong data-field="ok-count">—</strong>
                    <small data-field="ok-rate">—</small>
                </div>
                <div class="metric metric-ng">
                    <span>NG</span>
                    <strong data-field="ng-count">—</strong>
                    <small data-field="ng-rate">—</small>
                </div>
                <div class="metric metric-err">
                    <span>ERR</span>
                    <strong data-field="err-count">—</strong>
                    <small data-field="err-rate">—</small>
                </div>
                <div class="metric metric-omit">
                    <span>Omit 過曝</span>
                    <strong data-field="overexposed">—</strong>
                    <small>當班過曝略過數</small>
                </div>
                <div class="metric metric-time">
                    <span>平均耗時</span>
                    <strong data-field="avg-time">—</strong>
                    <small data-field="latest-duration">最近：—</small>
                </div>
            </div>

            <div class="group-heading">
                <span>設備健康</span>
                <small>EDGE SYSTEM</small>
            </div>

            <div class="system-grid">
                <div>
                    <span>模型版本</span>
                    <strong data-field="model-version">—</strong>
                </div>
                <div>
                    <span>運算裝置</span>
                    <strong data-field="device">—</strong>
                </div>
                <div>
                    <span>VRAM</span>
                    <strong data-field="vram">—</strong>
                </div>
                <div>
                    <span>GPU / 溫度</span>
                    <strong data-field="gpu-health">—</strong>
                </div>
                <div>
                    <span>RAM</span>
                    <strong data-field="ram">—</strong>
                </div>
                <div>
                    <span>硬碟剩餘</span>
                    <strong data-field="disk">—</strong>
                </div>
                <div>
                    <span>AOI 連線</span>
                    <strong data-field="connections">—</strong>
                </div>
            </div>

            <div class="latest-event">
                <div>
                    <span>最近判定</span>
                    <strong data-field="latest-glass">尚無資料</strong>
                </div>
                <span class="judgment-badge" data-field="latest-judgment">—</span>
                <span data-field="latest-time">—</span>
            </div>

            <div class="connection-error" data-field="error" hidden></div>
        </article>
    </template>
</body>
</html>
