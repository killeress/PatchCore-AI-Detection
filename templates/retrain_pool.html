{% extends "base.html" %}
{% block title %}重訓 Pool{% endblock %}
{% block content %}
<style>
  .pool-page { max-width: 1180px; margin: 0 auto; padding: 24px 16px; color: #cdd6f4; }
  .pool-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .pool-head h1 { margin: 0; font-size: 1.35rem; }
  .pool-link { background: #1e1e2e; color: #a6adc8; border: 1px solid #45475a; padding: 7px 14px; border-radius: 5px; text-decoration: none; font-size: .85rem; font-weight: 700; }
  .pool-filters { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; background: #11111b; border: 1px solid #313244; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
  .pool-filters label { display: flex; flex-direction: column; gap: 4px; color: #a6adc8; font-size: .78rem; }
  .pool-filters input, .pool-filters select { background: #1e1e2e; color: #cdd6f4; border: 1px solid #45475a; border-radius: 4px; padding: 6px 8px; min-width: 130px; }
  .pool-btn { background: #89b4fa; color: #1e1e2e; border: 0; padding: 7px 14px; border-radius: 5px; font-weight: 700; cursor: pointer; }
  .pool-btn.secondary { background: #1e1e2e; color: #a6adc8; border: 1px solid #45475a; }
  .pool-date { margin: 18px 0 8px; color: #f9e2af; font-size: .95rem; }
  .pool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; }
  .pool-item { background: #11111b; border: 1px solid #313244; border-radius: 8px; overflow: hidden; }
  .pool-item img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #000; display: block; }
  .pool-meta { padding: 8px; font-size: .76rem; color: #a6adc8; line-height: 1.45; }
  .pool-meta code { color: #cdd6f4; font-size: .72rem; }
  .pool-actions { display: flex; gap: 6px; padding: 0 8px 8px; }
  .pool-actions a, .pool-actions button { flex: 1; text-align: center; border-radius: 4px; padding: 5px 6px; font-size: .74rem; text-decoration: none; cursor: pointer; }
  .pool-actions a { background: #1e1e2e; color: #89b4fa; border: 1px solid #45475a; }
  .pool-actions button { background: #1e1e2e; color: #f38ba8; border: 1px solid #f38ba8; }
  .pool-actions button.unadd { color: #89b4fa; border-color: #89b4fa; }
  .pool-actions button[disabled] { color: #6c7086; border-color: #45475a; cursor: not-allowed; }
  .pool-empty { background: #11111b; border: 1px solid #313244; border-radius: 8px; padding: 28px; text-align: center; color: #a6adc8; }
</style>

<div class="pool-page">
  <div class="pool-head">
    <h1>重訓 Pool</h1>
    <a class="pool-link" href="/models">回模型庫</a>
  </div>

  <div class="pool-filters">
    <label>開始日期
      <input type="date" id="poolStartDate">
    </label>
    <label>結束日期
      <input type="date" id="poolEndDate">
    </label>
    <label>機種
      <input type="text" id="poolMachine" placeholder="例如 GN140BGAAN70S">
    </label>
    <label>Lighting
      <select id="poolLighting">
        <option value="">全部</option>
        {% for lighting in lightings %}<option>{{ lighting }}</option>{% endfor %}
      </select>
    </label>
    <label>Zone
      <select id="poolZone">
        <option value="">全部</option>
        <option>inner</option>
        <option>edge</option>
      </select>
    </label>
    <button class="pool-btn" onclick="loadPool()">查詢</button>
    <button class="pool-btn secondary" onclick="clearFilters()">清除</button>
    <span id="poolCount" style="color:#a6adc8;font-size:.8rem;"></span>
  </div>

  <div id="poolContent" class="pool-empty">載入中...</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const clientRecordId = params.get('client_record_id') || '';

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function clearFilters() {
  document.getElementById('poolStartDate').value = '';
  document.getElementById('poolEndDate').value = '';
  document.getElementById('poolMachine').value = '';
  document.getElementById('poolLighting').value = '';
  document.getElementById('poolZone').value = '';
  loadPool();
}

async function loadPool() {
  const content = document.getElementById('poolContent');
  const count = document.getElementById('poolCount');
  content.className = 'pool-empty';
  content.textContent = '載入中...';

  const qs = new URLSearchParams({ limit: '500' });
  const start = document.getElementById('poolStartDate').value;
  const end = document.getElementById('poolEndDate').value;
  const machine = document.getElementById('poolMachine').value.trim();
  const lighting = document.getElementById('poolLighting').value;
  const zone = document.getElementById('poolZone').value;
  if (start) qs.set('start_date', start);
  if (end) qs.set('end_date', end);
  if (machine) qs.set('machine_id', machine);
  if (lighting) qs.set('lighting', lighting);
  if (zone) qs.set('zone', zone);
  if (clientRecordId) qs.set('client_record_id', clientRecordId);

  try {
    const resp = await fetch(`/api/retrain-pool?${qs}`);
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || `HTTP ${resp.status}`);
    count.textContent = `共 ${data.total || 0} 個`;
    renderPool(data.items || []);
  } catch (err) {
    count.textContent = '';
    content.className = 'pool-empty';
    content.textContent = '載入失敗：' + err.message;
  }
}

function renderPool(items) {
  const content = document.getElementById('poolContent');
  if (!items.length) {
    content.className = 'pool-empty';
    content.textContent = '目前沒有符合條件的重訓 Pool 資料';
    return;
  }
  const groups = new Map();
  for (const item of items) {
    const date = item.created_date || 'unknown';
    if (!groups.has(date)) groups.set(date, []);
    groups.get(date).push(item);
  }
  content.className = '';
  content.innerHTML = Array.from(groups.entries()).map(([date, rows]) => `
    <h2 class="pool-date">${esc(date)} <span style="color:#a6adc8;font-size:.78rem;">(${rows.length})</span></h2>
    <div class="pool-grid">
      ${rows.map(renderItem).join('')}
    </div>
  `).join('');
}

function renderItem(item) {
  const unit = `${item.lighting || ''}-${item.zone || '未分區'}`;
  const added = item.added_to_job_id
    ? `<div>已匯入：<code>${esc(item.added_to_unit || item.added_to_job_id)}</code></div>`
    : '';
  const actionButton = item.added_to_job_id
    ? `<button class="unadd" onclick="unaddPoolItem(${item.id})">移出清單</button>`
    : `<button onclick="deletePoolItem(${item.id})">刪除</button>`;
  return `
    <div class="pool-item" id="poolItem${item.id}">
      <a href="${item.image_url}" target="_blank" rel="noopener">
        <img src="${item.thumb_url}" loading="lazy" alt="pool tile">
      </a>
      <div class="pool-meta">
        <div><code>${esc(item.machine_id)}</code></div>
        <div>Unit：<code>${esc(unit)}</code></div>
        <div>Panel：<code>${esc(item.pnl_id)}</code></div>
        <div>Score：${item.score != null ? Number(item.score).toFixed(3) : '—'}</div>
        <div>${esc(item.created_at || '')}</div>
        ${added}
      </div>
      <div class="pool-actions">
        <a href="/record/${item.inference_record_id}" target="_blank" rel="noopener">推論</a>
        ${actionButton}
      </div>
    </div>
  `;
}

async function unaddPoolItem(id) {
  if (!confirm('確定將此 Pool item 從訓練清單移出？\n這不會刪除 Pool 原始資料；若模型已訓練完成，移出不會回滾已產出的模型。')) return;
  const resp = await fetch('/api/retrain-pool/unadd', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ id }),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok || data.error) {
    alert('移出失敗：' + (data.error || resp.status));
    return;
  }
  loadPool();
}

async function deletePoolItem(id) {
  if (!confirm('確定刪除此 Pool item？會刪除 Pool 原始圖與縮圖。')) return;
  const resp = await fetch('/api/retrain-pool/delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ id }),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok || data.error) {
    alert('刪除失敗：' + (data.error || resp.status));
    return;
  }
  loadPool();
}

loadPool();
</script>
{% endblock %}
