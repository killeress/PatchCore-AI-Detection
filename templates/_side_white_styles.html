<style>
.sw-card{margin:20px 0;padding:22px;border:1px solid var(--border,#334155);border-radius:14px;background:var(--surface,#172033);color:var(--text,#e2e8f0)}
.sw-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.sw-head h3{font-size:18px;margin:0}
.sw-note{color:var(--text-muted,#94a3b8);font-size:13px;line-height:1.7;margin:8px 0;overflow-wrap:anywhere}
.sw-badge{display:inline-block;padding:4px 10px;border-radius:20px;background:rgba(56,189,248,.12);color:#38bdf8;font-size:12px}.sw-warn{background:rgba(245,158,11,.12);color:#fbbf24}
.sw-images{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin:16px 0}.sw-images figure{margin:0;min-width:0}.sw-images img{display:block;width:100%;max-height:420px;object-fit:contain;background:#080d14;border-radius:8px}.sw-images figcaption{font-size:12px;color:var(--text-muted,#94a3b8);margin:6px 0}
.sw-card a{color:#38bdf8}.sw-scroll{overflow-x:auto}.sw-table{border-collapse:collapse;width:100%;font-size:13px}.sw-table th,.sw-table td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border,#334155);white-space:nowrap}.sw-table th{color:var(--text-muted,#94a3b8);font-weight:500}
.sw-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.sw-controls input,.sw-controls select,.sw-controls textarea{background:var(--surface,#111827);color:var(--text,#e2e8f0);border:1px solid var(--border,#334155);border-radius:7px;padding:9px;font:inherit;max-width:100%}.sw-controls textarea{flex:1;min-width:180px}.sw-controls label{font-size:13px;display:flex;gap:6px;align-items:center}
.sw-btn{padding:9px 14px;background:rgba(56,189,248,.1);border:1px solid #0e7490;border-radius:7px;color:#38bdf8;cursor:pointer;font:inherit}.sw-btn:disabled{opacity:.5;cursor:default}.sw-card details>summary{cursor:pointer;color:var(--text-muted,#94a3b8);font-size:13px;margin:12px 0}.sw-empty{padding:28px;text-align:center;color:var(--text-muted,#94a3b8)}
.sw-param-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px;border:0;padding:0;margin:18px 0}.sw-param-grid label{display:flex;flex-direction:column;gap:8px;font-size:14px;min-width:0}.sw-param-grid input{box-sizing:border-box;width:100%;padding:10px;border:1px solid var(--border,#334155);border-radius:7px;background:var(--surface,#111827);color:var(--text,#e2e8f0);font:inherit}.sw-param-grid .sw-note{margin:0}.sw-param-grid:disabled{opacity:.6}
</style>
