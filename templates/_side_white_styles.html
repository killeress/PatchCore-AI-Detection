<style>
.sw-card{margin:20px 0;padding:22px;border:1px solid var(--border,#334155);border-radius:14px;background:var(--surface,#172033);color:var(--text,#e2e8f0)}
.sw-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.sw-head h3{font-size:18px;margin:0}
.sw-verdict{font-size:22px;font-weight:700;margin:8px 0 16px;line-height:1.4}.sw-conclusions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.sw-conclusion{padding:16px 18px;border:1px solid var(--border,#334155);border-radius:10px;background:rgba(148,163,184,.04)}.sw-conclusion-title{display:block;font-size:13px;color:var(--text-muted,#94a3b8);margin-bottom:8px}.sw-conclusion strong{font-size:17px;line-height:1.5}.sw-conclusion p{font-size:13px;line-height:1.6;color:var(--text-muted,#94a3b8);margin:7px 0 0;overflow-wrap:anywhere}.sw-tone-ok{color:#34d399}.sw-conclusion.sw-tone-ok{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.05)}.sw-tone-warn{color:#fbbf24}.sw-conclusion.sw-tone-warn{border-color:rgba(251,191,36,.3)}.sw-tone-neutral{color:var(--text,#e2e8f0)}.sw-technical{border-top:1px solid var(--border,#334155);margin-top:12px;padding-top:4px}.sw-table td.sw-wrap{white-space:normal;min-width:200px}.sw-evidence-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px}.sw-result-links{margin:0;gap:6px}.sw-result-links .sw-controls{margin:0}.sw-embedded{padding:0;border:0;margin:0;background:transparent}@media(max-width:800px){.sw-conclusions{grid-template-columns:1fr}.sw-verdict{font-size:19px}.sw-card{padding:16px}.sw-embedded{padding:0}}
.sw-tone-muted{color:var(--text-muted,#94a3b8)}
.sw-panel-projection{margin:12px 0;padding:12px 14px;border:1px solid var(--border,#334155);border-radius:8px;display:flex;align-items:baseline;gap:8px 16px;flex-wrap:wrap}.sw-panel-projection>span{font-size:13px;color:var(--text-muted,#94a3b8)}.sw-panel-projection>.sw-note{flex-basis:100%;margin:0}
.sw-note{color:var(--text-muted,#94a3b8);font-size:13px;line-height:1.7;margin:8px 0;overflow-wrap:anywhere}
.sw-badge{display:inline-block;padding:4px 10px;border-radius:20px;background:rgba(56,189,248,.12);color:#38bdf8;font-size:12px}.sw-warn{background:rgba(245,158,11,.12);color:#fbbf24}
.sw-images{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;margin:16px 0}.sw-images figure{margin:0;min-width:0}.sw-images img{display:block;width:100%;max-height:420px;object-fit:contain;background:#080d14;border-radius:8px}.sw-images figcaption{font-size:12px;color:var(--text-muted,#94a3b8);margin:6px 0}
.sw-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:18px}.sw-legend-item{display:inline-flex;align-items:center;gap:7px;font-size:12px;cursor:help}.sw-legend-item b{display:inline-block;color:var(--sw-annotation);border:1px solid var(--sw-annotation);border-radius:5px;padding:3px 6px;background:#0f172a;font-family:monospace}.sw-aoi-points{margin:18px 0}.sw-aoi-points h4{font-size:15px;margin:0 0 10px}.sw-aoi-id{color:#f43f5e;font-family:monospace}.sw-aoi-points code{font-family:monospace}.sw-aoi-points small{color:var(--text-muted,#94a3b8)}.sw-aoi-points .sw-note{margin:4px 0}.sw-annotation-warning{border-left:3px solid #fbbf24;padding-left:10px}.sw-legend-help dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 12px;font-size:13px;line-height:1.6}.sw-legend-help dt{font-weight:600}.sw-legend-help dd{margin:0;color:var(--text-muted,#94a3b8)}
.sw-card a{color:#38bdf8}.sw-scroll{overflow-x:auto}.sw-table{border-collapse:collapse;width:100%;font-size:13px}.sw-table th,.sw-table td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border,#334155);white-space:nowrap}.sw-table th{color:var(--text-muted,#94a3b8);font-weight:500}
.sw-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.sw-controls input,.sw-controls select,.sw-controls textarea{background:var(--surface,#111827);color:var(--text,#e2e8f0);border:1px solid var(--border,#334155);border-radius:7px;padding:9px;font:inherit;max-width:100%}.sw-controls textarea{flex:1;min-width:180px}.sw-controls label{font-size:13px;display:flex;gap:6px;align-items:center}
.sw-btn{padding:9px 14px;background:rgba(56,189,248,.1);border:1px solid #0e7490;border-radius:7px;color:#38bdf8;cursor:pointer;font:inherit}.sw-btn:disabled{opacity:.5;cursor:default}.sw-card details>summary{cursor:pointer;color:var(--text-muted,#94a3b8);font-size:13px;margin:12px 0}.sw-empty{padding:28px;text-align:center;color:var(--text-muted,#94a3b8)}
.sw-param-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px;border:0;padding:0;margin:18px 0}.sw-param-grid label{display:flex;flex-direction:column;gap:8px;font-size:14px;min-width:0}.sw-param-grid input{box-sizing:border-box;width:100%;padding:10px;border:1px solid var(--border,#334155);border-radius:7px;background:var(--surface,#111827);color:var(--text,#e2e8f0);font:inherit}.sw-param-grid .sw-note{margin:0}.sw-param-grid:disabled{opacity:.6}
</style>
<style>.sw-composite{display:block;width:100%;height:auto;background:#080d14;border-radius:8px}.sw-candidate{border-top:1px solid var(--border,#334155);padding:6px 0}.sw-param-grid select{padding:10px;background:var(--surface,#111827);color:var(--text,#e2e8f0);border:1px solid var(--border,#334155);border-radius:7px}.sw-param-grid input[type=checkbox]{width:auto;align-self:flex-start}</style>
