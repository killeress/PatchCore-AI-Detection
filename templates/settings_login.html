{% extends "base.html" %}

{% block title %}參數設定登入 — {{ station_name }} AI{% endblock %}

{% block extra_css %}
<style>
    .settings-login-wrap {
        max-width: 420px;
        margin: 72px auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    .settings-login-wrap h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        color: var(--text);
    }

    .settings-login-wrap p {
        margin: 0 0 22px;
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    .settings-login-field {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin-bottom: 16px;
    }

    .settings-login-field label {
        color: #cbd5e1;
        font-size: 0.86rem;
        font-weight: 600;
    }

    .settings-login-field input {
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
        padding: 11px 12px;
    }

    .settings-login-error {
        min-height: 20px;
        color: #fca5a5;
        font-size: 0.86rem;
        margin-bottom: 14px;
    }

    .settings-login-submit {
        width: 100%;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 11px 14px;
    }

    .settings-login-submit:disabled {
        cursor: not-allowed;
        opacity: 0.65;
    }
</style>
{% endblock %}

{% block content %}
<div class="settings-login-wrap">
    <h1>參數設定登入</h1>
    <p>進入參數設定與修改設定前需要登入帳號。</p>
    <form id="settings-login-form">
        <div class="settings-login-field">
            <label for="settings-login-username">帳號</label>
            <input id="settings-login-username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="settings-login-field">
            <label for="settings-login-password">密碼</label>
            <input id="settings-login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="settings-login-error" class="settings-login-error"></div>
        <button id="settings-login-submit" class="settings-login-submit" type="submit">登入</button>
    </form>
</div>

<script>
    const SETTINGS_LOGIN_NEXT = {{ next_path|tojson }};
    document.getElementById('settings-login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const btn = document.getElementById('settings-login-submit');
        const err = document.getElementById('settings-login-error');
        btn.disabled = true;
        err.textContent = '';
        try {
            const res = await fetch('/api/settings/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('settings-login-username').value.trim(),
                    password: document.getElementById('settings-login-password').value,
                    next: SETTINGS_LOGIN_NEXT || '/settings',
                }),
            });
            const data = await res.json();
            if (!res.ok || data.error) throw new Error(data.error || '登入失敗');
            window.location.href = data.redirect || '/settings';
        } catch (e) {
            err.textContent = e.message;
        } finally {
            btn.disabled = false;
        }
    });
</script>
{% endblock %}
